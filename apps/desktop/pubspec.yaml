name: droidlab_desktop
description: Native Flutter desktop workstation for Android device engineering.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  droidlab_application:
    path: ../../packages/droidlab_application
  droidlab_design_system:
    path: ../../packages/droidlab_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  droidlab_backend_bridge:
    path: ../../packages/droidlab_backend_bridge

flutter:
  uses-material-design: true
