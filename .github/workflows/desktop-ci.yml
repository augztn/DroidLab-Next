name: Desktop CI
on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: droidlab-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  flutter:
    name: Flutter desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate native runner projects
        working-directory: apps/desktop
        run: flutter create --project-name droidlab_desktop --platforms=linux,windows,macos .
      - name: Resolve dependencies
        working-directory: apps/desktop
        run: flutter pub get
      - name: Upload resolved dependency lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-pubspec-lock
          path: apps/desktop/pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Analyze
        working-directory: apps/desktop
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        working-directory: apps/desktop
        run: flutter test
      - name: Domain model tests (typed device boundary)
        working-directory: packages/droidlab_domain
        run: flutter test
      - name: Build desktop release
        working-directory: apps/desktop
        run: flutter build ${{ matrix.platform }} --release
      - name: Stage Python backend (Windows)
        if: runner.os == 'Windows'
        run: python scripts/stage_backend.py
      - name: Stage Python backend (Linux and macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/stage_backend.py
      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O "$RUNNER_TEMP/appimagetool"
          sudo install -m 0755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          VERSION: 0.1.0
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/build-linux-appimage.sh
      - name: Smoke-test AppImage contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -s "$appimage"
          chmod +x "$appimage"
          file "$appimage" | grep -q 'ELF'
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          (cd "$smoke_dir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          appdir="$smoke_dir/squashfs-root"
          test -x "$appdir/AppRun"
          test -x "$appdir/usr/bin/droidlab_desktop"
          test -x "$appdir/usr/bin/payload-dumper-go"
          test -f "$appdir/usr/lib/droidlab/backend/server.py"
          test -f "$appdir/droidlab.desktop"
          test -f "$appdir/.DirIcon"
      - name: Upload portable AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: tar -C apps/desktop/build/linux/x64/release/bundle -czf DroidLab-linux-x64.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-${{ matrix.platform }}
          path: |
            apps/desktop/build/${{ matrix.platform }}/**/*
            DroidLab-linux-x64.tar.gz
            dist/*.AppImage
          if-no-files-found: warn

  python-backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m compileall -q backend/python
      - name: Run backend tests
        run: python -m unittest discover -s backend/python/tests -v
