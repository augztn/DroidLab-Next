name: Desktop CI
on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    name: Flutter desktop (\${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate native runner projects
        working-directory: apps/desktop
        run: flutter create --project-name droidlab_desktop --platforms=linux,windows,macos .
      - name: Resolve dependencies
        working-directory: apps/desktop
        run: flutter pub get
      - name: Analyze
        working-directory: apps/desktop
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        working-directory: apps/desktop
        run: flutter test
      - name: Build desktop release
        working-directory: apps/desktop
        run: flutter build \${{ matrix.platform }} --release
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: tar -C apps/desktop/build/linux/x64/release/bundle -czf DroidLab-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: droidlab-\${{ matrix.platform }}
          path: |
            apps/desktop/build/\${{ matrix.platform }}/**/*
            DroidLab-linux-x64.tar.gz
          if-no-files-found: warn

  python-backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m compileall -q backend/python
      - name: Run backend tests
        run: python -m unittest discover -s backend/python/tests -v
