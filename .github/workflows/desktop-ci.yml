name: Desktop CI
on:
  push:
    branches: [main, 'rewrite/**', 'hardening/**', 'feature/**', 'ui/**']
  pull_request:
    branches: [main, 'rewrite/**']
  workflow_dispatch:
concurrency:
  group: droidlab-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  flutter:
    name: Flutter desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xz-utils
      - name: Generate native runner projects
        working-directory: apps/desktop
        run: flutter create --project-name droidlab_desktop --platforms=linux,windows,macos .
      - name: Resolve dependencies
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile
      - name: Upload resolved dependency lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-pubspec-lock
          path: apps/desktop/pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Analyze desktop and all Dart packages
        shell: bash
        run: |
          set -euo pipefail
          for package in apps/desktop packages/droidlab_domain packages/droidlab_design_system packages/droidlab_application packages/droidlab_backend_bridge; do
            echo "Analyzing $package"
            (cd "$package" && flutter analyze --fatal-infos)
          done
      - name: Unit and widget tests
        working-directory: apps/desktop
        run: flutter test
      - name: Domain model tests (typed device boundary)
        working-directory: packages/droidlab_domain
        run: flutter test
      - name: Design system tests (legacy palette and adaptive themes)
        working-directory: packages/droidlab_design_system
        run: flutter test
      - name: Application package tests
        working-directory: packages/droidlab_application
        run: flutter test
      - name: Backend bridge lifecycle tests
        working-directory: packages/droidlab_backend_bridge
        run: flutter test
      - name: Build desktop release
        working-directory: apps/desktop
        run: flutter build ${{ matrix.platform }} --release
      - name: Stage Python backend (Windows)
        if: runner.os == 'Windows'
        run: python scripts/stage_backend.py
      - name: Stage Python backend (Linux and macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/stage_backend.py
      - name: Stage bundled CPython runtime (Windows)
        if: runner.os == 'Windows'
        run: python scripts/stage_python_runtime.py
      - name: Stage bundled CPython runtime (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/stage_python_runtime.py
      - name: Smoke-test bundled Python and backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = Resolve-Path 'apps/desktop/build/windows/x64/runner/Release/python/python.exe'
          $env:DROIDLAB_BACKEND_TEST_PATH = (Resolve-Path 'apps/desktop/build/windows/x64/runner/Release/backend/python').Path
          & $python -c "import json, ssl, subprocess, os, sys; sys.path.insert(0, os.environ['DROIDLAB_BACKEND_TEST_PATH']); import server; import droidlab.core.tool_resolver"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Windows Python/backend smoke test failed.' }
          if (-not (Test-Path 'apps/desktop/build/windows/x64/runner/Release/backend/python/server.py')) { throw 'Windows backend payload is missing.' }
      - name: Smoke-test bundled Python and backend (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          python="$app/Contents/Resources/python/bin/python3"
          test -x "$python"
          DROIDLAB_BACKEND_TEST_PATH="$app/Contents/Resources/backend/python" "$python" -c 'import json, ssl, subprocess, os, sys; sys.path.insert(0, os.environ["DROIDLAB_BACKEND_TEST_PATH"]); import server; import droidlab.core.tool_resolver'
          test -f "$app/Contents/Resources/backend/python/server.py"
      - name: Verify payload-dumper-go runtime dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v xz >/dev/null
          xz --version
      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          url='https://api.github.com/repos/AppImage/appimagetool/releases/assets/324406736'
          expected='ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
          runtime_url='https://api.github.com/repos/AppImage/type2-runtime/releases/assets/326011592'
          runtime_expected='2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
          download_with_retry() {
            local url="$1" destination="$2"
            for attempt in {1..8}; do
              if curl --fail --location --silent --show-error --header "Accept: application/octet-stream" --retry 2 --retry-all-errors --connect-timeout 30 --max-time 300 "$url" --output "$destination"; then
                return 0
              fi
              rm -f "$destination"
              if [[ "$attempt" -lt 8 ]]; then
                local delay=$(( attempt * 5 ))
                echo "Download attempt $attempt/8 failed; retrying in ${delay}s." >&2
                sleep "$delay"
              fi
            done
            echo "Unable to download $url after 8 attempts." >&2
            return 1
          }
          download_with_retry "$url" "$RUNNER_TEMP/appimagetool"
          echo "$expected  $RUNNER_TEMP/appimagetool" | sha256sum --check --status
          download_with_retry "$runtime_url" "$RUNNER_TEMP/appimage-runtime"
          echo "$runtime_expected  $RUNNER_TEMP/appimage-runtime" | sha256sum --check --status
          sudo install -m 0755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          VERSION: 0.1.0
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGE_RUNTIME_FILE: ${{ runner.temp }}/appimage-runtime
        run: bash scripts/build-linux-appimage.sh
      - name: Smoke-test AppImage contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -s "$appimage"
          chmod +x "$appimage"
          file "$appimage" | grep -q 'ELF'
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          (cd "$smoke_dir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          appdir="$smoke_dir/squashfs-root"
          test -x "$appdir/AppRun"
          test -x "$appdir/usr/bin/droidlab_desktop"
          test -x "$appdir/usr/bin/payload-dumper-go"
          test -f "$appdir/usr/lib/droidlab/backend/server.py"
          test -f "$appdir/droidlab.desktop"
          test -f "$appdir/.DirIcon"
      - name: Upload portable AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: tar -C apps/desktop/build/linux/x64/release/bundle -czf DroidLab-linux-x64.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: droidlab-${{ matrix.platform }}
          path: |
            apps/desktop/build/${{ matrix.platform }}/**/*
            DroidLab-linux-x64.tar.gz
            dist/*.AppImage
          if-no-files-found: warn

  python-backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m compileall -q backend/python
      - name: Run backend tests
        run: python -m unittest discover -s backend/python/tests -v
