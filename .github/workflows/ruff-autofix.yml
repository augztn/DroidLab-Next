name: Temporary Ruff autofix

on:
  push:
    branches: [audit/ruff-autofix]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply safe Ruff fixes and formatting
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff check src tests --fix || true
          ruff format src tests
          rm .github/workflows/ruff-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: apply Ruff autofixes and formatting"
          git push origin HEAD:audit/ruff-autofix
